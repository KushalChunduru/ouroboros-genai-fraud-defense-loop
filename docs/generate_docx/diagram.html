<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="diag" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ============ Row 1: Identify / Generate / Defend ============ -->
  <rect x="70" y="80" width="300" height="150" rx="16" fill="#F3F1FE" stroke="#5B3DF5" stroke-width="2.5"/>
  <text x="220" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#5B3DF5" letter-spacing="1">① IDENTIFY</text>
  <text x="220" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Living Taxonomy</text>
  <text x="220" y="193" text-anchor="middle" font-size="15" fill="#4B5563">15 grounded vectors,</text>
  <text x="220" y="213" text-anchor="middle" font-size="15" fill="#4B5563">4 independent axes</text>

  <rect x="650" y="80" width="300" height="150" rx="16" fill="#ECFDF5" stroke="#0D8F72" stroke-width="2.5"/>
  <text x="800" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0D8F72" letter-spacing="1">② GENERATE</text>
  <text x="800" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Entity-Conditioned</text>
  <text x="800" y="193" text-anchor="middle" font-size="15" fill="#4B5563">Behavioral simulator +</text>
  <text x="800" y="213" text-anchor="middle" font-size="15" fill="#4B5563">Gemini narrative agent</text>

  <rect x="1230" y="80" width="300" height="150" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="1380" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB" letter-spacing="1">③ DEFEND</text>
  <text x="1380" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Fused Detector</text>
  <text x="1380" y="193" text-anchor="middle" font-size="15" fill="#4B5563">Tabular + Graph +</text>
  <text x="1380" y="213" text-anchor="middle" font-size="15" fill="#4B5563">Content signal</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D8F72"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>
  <path d="M370,155 H650" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M950,155 H1230" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- ============ Row 2: three detector sub-signals feeding Defend ============ -->
  <rect x="1160" y="300" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1225" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Tabular</text>
  <text x="1225" y="355" text-anchor="middle" font-size="12" fill="#4B5563">GBM signal</text>

  <rect x="1310" y="300" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1375" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Graph</text>
  <text x="1375" y="355" text-anchor="middle" font-size="12" fill="#4B5563">Propagation</text>

  <rect x="1460" y="300" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1525" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Content</text>
  <text x="1525" y="355" text-anchor="middle" font-size="12" fill="#4B5563">Language score</text>

  <path d="M1225,300 V265 H1380 V230" stroke="#6B7280" stroke-width="2" fill="none"/>
  <path d="M1375,300 V265" stroke="#6B7280" stroke-width="2" fill="none"/>
  <path d="M1525,300 V265 H1380" stroke="#6B7280" stroke-width="2" fill="none"/>

  <!-- ============ Row 3: Self-Play + Zero-Day feedback loops ============ -->
  <rect x="650" y="470" width="300" height="140" rx="16" fill="#ECFDF5" stroke="#0D8F72" stroke-width="2.5"/>
  <text x="800" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#0D8F72" letter-spacing="1">④ SELF-PLAY ARMS RACE</text>
  <text x="800" y="548" text-anchor="middle" font-size="15" fill="#4B5563">N rounds, escalating evasion,</text>
  <text x="800" y="568" text-anchor="middle" font-size="15" fill="#4B5563">fresh detector every round</text>

  <rect x="1130" y="470" width="340" height="140" rx="16" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
  <text x="1300" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309" letter-spacing="1">⑤ ZERO-DAY DISCOVERY</text>
  <text x="1300" y="548" text-anchor="middle" font-size="15" fill="#4B5563">Unsupervised clustering on the</text>
  <text x="1300" y="568" text-anchor="middle" font-size="15" fill="#4B5563">blind spot + LLM hypothesis</text>

  <!-- Defend -> Self-Play (feedback down): drop from Defend's left edge -->
  <path d="M1300,230 V420 H800 V470" stroke="#0D8F72" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGreen)" fill="none"/>
  <rect x="880" y="398" width="330" height="26" fill="#ffffff"/>
  <text x="1045" y="416" text-anchor="middle" font-size="13" fill="#0D8F72" font-weight="600">escalate evasion on what got caught</text>

  <!-- Defend -> Zero-Day (feedback down): drop from Defend's right edge -->
  <path d="M1460,230 V470" stroke="#B45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowAmber)" fill="none"/>

  <!-- Zero-Day -> Identify (new attack hypothesis back into taxonomy): runs below everything -->
  <path d="M1300,610 V670 H220 V230" stroke="#B45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowAmber)" fill="none"/>
  <rect x="330" y="657" width="330" height="26" fill="#ffffff"/>
  <text x="495" y="675" text-anchor="middle" font-size="13" fill="#B45309" font-weight="600">new candidate attack vector, mined from the blind spot</text>

  <!-- Footer -->
  <text x="800" y="820" text-anchor="middle" font-size="14" fill="#9CA3AF" font-style="italic">The two dashed feedback paths are what make this a closed loop instead of a linear pipeline.</text>
</svg>
</body>
</html>
